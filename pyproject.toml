[project]
name = "git-manager"
version = "0.1.0"
description = ""
authors = [{ name = "Damian Jankowski" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.0,<3",
    "gitpython>=3.1.50,<4",
    "loguru==0.7.3",
    "tabulate>=0.10.0,<0.11",
    "pyyaml>=6.0.3,<7",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0,<5",
]

[tool.uv]
# CLI run from source (uv run python git_manager/main.py), not a distributable package.
package = false

[tool.ruff]
line-length = 97
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
fixable = ["I"]
